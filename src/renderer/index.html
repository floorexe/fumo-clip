<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' clipdeck:; img-src 'self' clipdeck: data:; media-src 'self' clipdeck:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Fumo Clip</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="themes.js"></script>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><span class="logo"></span>Fumo Clip</div>
      <nav id="nav">
        <button class="nav-item active" data-view="all"><i data-icon="grid"></i><span>All clips</span><em id="count-all">0</em></button>
        <button class="nav-item" data-view="favorites"><i data-icon="star"></i><span>Favorites</span><em id="count-fav">0</em></button>
        <button class="nav-item" data-view="exports"><i data-icon="export"></i><span>Exports</span><em id="count-exp">0</em></button>
      </nav>
      <div class="side-scroll">
        <div class="nav-head"><span>Games</span><small title="Ctrl-click or Shift-click games to select all their clips">Ctrl-click to select</small></div>
        <nav id="games"></nav>
        <div class="nav-head"><span>Categories</span><button id="btn-new-cat" class="icon-btn tiny" title="New category"><i data-icon="plus"></i></button></div>
        <nav id="cats"></nav>
      </div>
      <div class="sidebar-foot">
        <div id="obs-pill" class="obs-pill" title="OBS connection"><span class="dot"></span><span class="txt">OBS</span></div>
        <button id="btn-settings" class="icon-btn" title="Settings"><i data-icon="gear"></i></button>
      </div>
    </aside>

    <main id="main">
      <!-- LIBRARY VIEW -->
      <section id="library-view">
        <header class="toolbar">
          <h1 id="view-title">All clips</h1>
          <div class="search"><i data-icon="search"></i><input id="search" placeholder="Search clips…" spellcheck="false" /></div>
          <select id="sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="longest">Longest</option>
            <option value="shortest">Shortest</option>
            <option value="largest">Largest</option>
            <option value="name">Name</option>
          </select>
          <input id="card-size" type="range" min="200" max="420" value="280" title="Card size" />
          <button id="btn-folder" class="btn ghost" title="Open library folder"><i data-icon="folder"></i></button>
          <button id="btn-save-replay" class="btn primary" title="Save the OBS replay buffer now"><i data-icon="record"></i>Save replay</button>
        </header>
        <div id="selection-bar" class="selection-bar hidden">
          <span id="sel-count"></span>
          <button class="btn primary" data-sel="combine" title="Join the selected clips into one video"><i data-icon="layers"></i>Combine</button>
          <button class="btn ghost" data-sel="fav"><i data-icon="star"></i>Favorite</button>
          <button class="btn ghost" data-sel="tags"><i data-icon="tag"></i>Categories</button>
          <button class="btn ghost" data-sel="move"><i data-icon="folder"></i>Move to game</button>
          <button class="btn danger" data-sel="delete"><i data-icon="trash"></i>Delete</button>
          <button class="btn ghost" data-sel="clear">Clear</button>
        </div>
        <div id="grid-wrap"><div id="grid"></div><div id="empty" class="empty hidden"></div></div>
      </section>

      <!-- PLAYER VIEW -->
      <section id="player-view" class="hidden">
        <header class="toolbar">
          <button id="btn-back" class="btn ghost"><i data-icon="back"></i>Library</button>
          <h1 id="p-title" class="p-title"></h1>
          <button id="p-fav" class="icon-btn" title="Favorite (S)"><i data-icon="star"></i></button>
          <button id="p-prev" class="icon-btn" title="Previous clip (↑)"><i data-icon="prev"></i></button>
          <button id="p-next" class="icon-btn" title="Next clip (↓)"><i data-icon="next"></i></button>
        </header>

        <div class="player-top">
          <div id="stage" class="stage">
            <video id="video" preload="auto" playsinline></video>
            <div id="stage-msg" class="stage-msg hidden"></div>
          </div>
          <aside class="side-col">
            <div class="panel">
              <div class="panel-head">Clip details</div>
              <div class="field"><label>Name</label><input id="i-title" spellcheck="false" /></div>
              <div class="field"><label>Game (folder)</label><input id="i-game" list="game-list" spellcheck="false" /><datalist id="game-list"></datalist></div>
              <div class="field"><label>Categories</label><div id="i-tags" class="tag-box"></div></div>
              <div id="i-meta" class="meta-grid"></div>
              <div class="row gap">
                <button id="i-show" class="btn ghost sm"><i data-icon="folder"></i>Show in folder</button>
                <button id="i-copy" class="btn ghost sm"><i data-icon="copy"></i>Copy file</button>
                <button id="i-delete" class="btn danger sm"><i data-icon="trash"></i>Delete</button>
              </div>
            </div>
          </aside>
        </div>

        <div id="tl-panel" class="tl-panel">
          <div class="tl-head">
            <div class="tl-head-left">
              <span id="c-time" class="time">0:00.0 / 0:00.0</span>
              <span class="zoom" title="Timeline zoom (Ctrl + scroll on the timeline, or + / −)">
                <button id="z-out" class="icon-btn"><i data-icon="zoomOut"></i></button>
                <input id="z-range" type="range" min="0" max="1000" value="0" />
                <button id="z-in" class="icon-btn"><i data-icon="zoomIn"></i></button>
                <button id="z-fit" class="btn ghost sm">Fit</button>
              </span>
            </div>
            <div class="tl-head-mid">
              <button id="c-mute" class="icon-btn" title="Mute (M)"><i data-icon="vol"></i></button>
              <input id="c-vol" class="vol" type="range" min="0" max="100" value="100" title="Listening volume" />
              <button id="c-start" class="icon-btn" title="Go to start (Home)"><i data-icon="prev"></i></button>
              <button id="c-frame-b" class="icon-btn" title="Previous frame (,)"><i data-icon="framePrev"></i></button>
              <button id="c-play" class="icon-btn big" title="Play/Pause (Space)"><i data-icon="play"></i></button>
              <button id="c-frame-f" class="icon-btn" title="Next frame (.)"><i data-icon="frameNext"></i></button>
              <button id="c-end" class="icon-btn" title="Go to end (End)"><i data-icon="next"></i></button>
              <select id="c-speed" title="Playback speed">
                <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
                <option value="1.5">1.5×</option><option value="2">2×</option>
              </select>
              <button id="c-full" class="icon-btn" title="Fullscreen (F)"><i data-icon="full"></i></button>
            </div>
            <div class="tl-head-right">
              <button id="c-in" class="btn ghost sm" title="Trim start at playhead (I)">[ Start</button>
              <button id="c-out" class="btn ghost sm" title="Trim end at playhead (O)">End ]</button>
              <button id="c-clear-trim" class="btn ghost sm" title="Remove trim">Reset</button>
              <label class="toggle sm" title="On: the trimmed part repeats. Off: playback stops at the trim end."><input id="c-loop" type="checkbox" checked /><span>Loop</span></label>
              <button id="c-marker" class="icon-btn" title="Add marker at playhead (B). Ctrl+←/→ jumps between markers, right-click a marker to remove it."><i data-icon="flag"></i></button>
              <button id="c-frame" class="icon-btn" title="Copy this frame as an image (C)"><i data-icon="camera"></i></button>
              <button id="btn-share" class="btn primary"><i data-icon="export"></i>Share clip</button>
            </div>
          </div>
          <div class="tl-body">
            <div id="tl-labels" class="tl-labels"></div>
            <div id="tl-lanes" class="tl-lanes">
              <div id="tl-inner">
                <div id="tl-ruler" class="tl-ruler"></div>
                <div id="tl-rows"></div>
                <div class="tl-overlay">
                  <div class="tl-dim left"></div>
                  <div class="tl-dim right"></div>
                  <div id="tl-markers"></div>
                  <div class="tl-handle in" title="Drag to set the start (I)"></div>
                  <div class="tl-handle out" title="Drag to set the end (O)"></div>
                  <div class="tl-playhead"><span></span></div>
                  <div class="tl-hover"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="ctx" class="ctx hidden"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="icons.js"></script>
  <script src="mixer.js"></script>
  <script src="app.js"></script>
</body>
</html>
